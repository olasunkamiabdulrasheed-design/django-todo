<header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/80 backdrop-blur-md
               dark:border-slate-800 dark:bg-slate-950/80">
    <div class="mx-auto flex w-full max-w-5xl items-center justify-between gap-3 px-4 py-3 sm:px-6">

        <a href="{% url 'home' %}" class="group flex items-center gap-2.5">
            <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-brand-500 to-violet-600
                         text-white shadow-lg shadow-brand-600/25 transition group-hover:scale-105">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                     stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
                    <path d="M20 6 9 17l-5-5"/>
                </svg>
            </span>
            <span class="text-lg font-bold tracking-tight">TaskFlow</span>
        </a>

        <nav class="flex items-center gap-1.5">
            <a href="{% url 'focus' %}"
               class="hidden rounded-xl px-3 py-2 text-sm font-semibold text-slate-600 transition
                      hover:bg-slate-100 hover:text-slate-900 sm:block
                      dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white">
                Focus
            </a>

            <a href="{% url 'item_list' %}"
               class="hidden rounded-xl px-3 py-2 text-sm font-semibold text-slate-600 transition
                      hover:bg-slate-100 hover:text-slate-900 sm:block
                      dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white">
                My tasks
            </a>

            <a href="{% url 'item_create' %}" class="btn-primary !px-3.5 !py-2">
                <span class="text-base leading-none">+</span>
                <span class="hidden sm:inline">New task</span>
            </a>

            <button type="button" id="theme-toggle" aria-pressed="false"
                    class="grid h-9 w-9 place-items-center rounded-xl border border-slate-200 bg-white
                           text-sm transition hover:bg-slate-50
                           dark:border-slate-700 dark:bg-slate-900 dark:hover:bg-slate-800">
                <span data-theme-icon>🌙</span>
                <span class="sr-only">Toggle dark mode</span>
            </button>
        </nav>
    </div>
</header>
