<div class="card flex flex-col items-center justify-center gap-3 px-6 py-16 text-center">
    <div class="grid h-16 w-16 place-items-center rounded-2xl bg-slate-100 text-3xl dark:bg-slate-800">
        {{ icon|default:'🗒️' }}
    </div>
    <h2 class="text-lg font-bold">{{ title|default:'Nothing here yet' }}</h2>
    <p class="max-w-sm text-sm text-slate-500 dark:text-slate-400">{{ message }}</p>

    {% if action_url %}
    <a href="{{ action_url }}" class="btn-primary mt-2">{{ action_label }}</a>
    {% endif %}
</div>
