{% load task_extras %}
{% if messages %}
<div class="mx-auto w-full max-w-5xl px-4 pt-5 sm:px-6" aria-live="polite">
    {% for message in messages %}
    <div class="mb-3 flex items-start gap-3 rounded-2xl border px-4 py-3 text-sm font-medium shadow-sm
                animate-fade-up {{ message.tags|default:'bg-slate-100 border-slate-300 text-slate-700' }}">
        <span class="mt-0.5 shrink-0" aria-hidden="true">{{ message|message_icon }}</span>
        <p>{{ message }}</p>
    </div>
    {% endfor %}
</div>
{% endif %}
