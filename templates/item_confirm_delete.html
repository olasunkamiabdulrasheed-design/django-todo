{% extends 'base.html' %}

{% block title %}Delete {{ item.title }}{% endblock %}

{% block content %}

<div class="max-w-md mx-auto bg-white border border-red-200 rounded-2xl p-8 shadow text-center">

    <div class="w-14 h-14 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6 text-2xl">
        ⚠️
    </div>

    <h1 class="text-xl font-bold text-gray-800 mb-2">Are you sure?</h1>
    <p class="text-gray-500 text-sm mb-6">
        You are about to permanently delete:<br>
        <span class="font-bold text-red-500">"{{ item.title }}"</span>
    </p>

    <form method="POST" class="flex justify-center space-x-4">
        {% csrf_token %}
        <button type="submit"
                class="px-5 py-2.5 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 transition text-sm">
            Yes, Delete
        </button>
        <a href="{% url 'item_detail' item.pk %}"
           class="px-5 py-2.5 border border-gray-300 text-gray-500 hover:text-gray-800 rounded-xl font-medium transition text-sm">
            Cancel
        </a>
    </form>

</div>

{% endblock %}
