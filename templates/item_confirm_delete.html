{% extends 'base.html' %}

{% block title %}Delete "{{ item.title }}" — TaskFlow{% endblock %}

{% block content %}

<div class="mx-auto max-w-md">
    <div class="card animate-pop overflow-hidden text-center">

        <div class="h-1.5 w-full bg-rose-500"></div>

        <div class="p-8">
            <div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-rose-100 text-2xl
                        dark:bg-rose-500/15">
                ⚠️
            </div>

            <h1 class="mt-5 text-xl font-extrabold tracking-tight">Delete this task?</h1>
            <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
                This can't be undone.
            </p>

            <p class="mt-4 rounded-xl bg-slate-50 px-4 py-3 text-sm font-semibold text-slate-700
                      dark:bg-slate-800 dark:text-slate-200">
                "{{ item.title }}"
            </p>

            <form method="post" class="mt-6 flex justify-center gap-3">
                {% csrf_token %}
                <button type="submit" class="btn-danger">Yes, delete it</button>
                <a href="{% url 'item_detail' item.pk %}" class="btn-ghost">Cancel</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
