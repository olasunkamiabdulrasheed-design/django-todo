{% extends 'base.html' %}

{% block title %}Home | To-Do App{% endblock %}

{% block content %}

<div class="text-center py-20">
    <h1 class="text-5xl font-bold text-blue-600">
        📝 Welcome to To-Do App
    </h1>

    <p class="text-gray-600 mt-4 text-lg">
        Stay organized, manage your daily tasks, and boost your productivity.
    </p>

    <div class="mt-8 space-x-4">
        <a href="{% url 'item_list' %}"
           class="inline-block px-6 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 transition">
            View Tasks
        </a>

        <a href="{% url 'item_create' %}"
           class="inline-block px-6 py-3 bg-green-600 text-white font-bold rounded-xl hover:bg-green-700 transition">
            Add New Task
        </a>
    </div>
</div>

{% endblock %}
